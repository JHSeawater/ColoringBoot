<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <!-- 컬러링붓 전용 템플릿 (Phase 7.6) — 로딩 화면은 타이틀 화면과 같은 모습(UiTheme 색), 그림 파일 · 웹 글꼴 없이 HTML · CSS · SVG만.
         휴대폰은 화면 전체, PC는 창 높이에 맞춘 9:16 세로 영역 + 양옆 여백(CLAUDE.md §4 레터박스) -->
    <div id="game">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="loading">
        <svg class="chips" viewBox="0 0 330 112" aria-hidden="true">
          <polygon points="55,4 100,30 100,82 55,108 10,82 10,30" fill="#D8402F"/>
          <polygon points="165,4 210,30 210,82 165,108 120,82 120,30" fill="#F1B928"/>
          <polygon points="275,4 320,30 320,82 275,108 230,82 230,30" fill="#2D69CF"/>
        </svg>
        <div class="title">{{{ PRODUCT_NAME }}}</div>
        <div class="bar"><div class="fill" id="loading-fill"></div></div>
        <div class="status" id="loading-status">불러오는 중</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var statusText = document.querySelector("#loading-status");

      // 오류는 로딩 화면에 한국어로, 경고는 콘솔에만
      function showError(message) {
        loading.classList.remove("done");
        loading.classList.add("error");
        statusText.textContent = "불러오지 못했어요. 새로고침해 주세요.";
        console.error(message);
      }
      function unityShowBanner(msg, type) {
        if (type == "error") showError(msg);
        else console.warn(msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // 휴대폰: 브라우저 화면 전체 (Unity 기본 템플릿과 같은 뷰포트 — Phase 2에서 안전영역 · 세로 화면 확인된 설정)
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        document.body.className = "mobile";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = (100 * progress) + "%";
          statusText.textContent = "불러오는 중 " + Math.round(100 * progress) + "%";
        }).then(function (unityInstance) {
          // 첫 화면(타이틀)이 그려진 뒤 로딩 화면을 걷어 낸다
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 400);
#if SHOW_DIAGNOSTICS
          var icon = document.createElement("img");
          icon.id = "diagnostics-icon";
          icon.src = "TemplateData/webmemd-icon.png";
          icon.onclick = function () { unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo); };
          document.body.appendChild(icon);
#endif
        }).catch(showError);
      };
      script.onerror = function () { showError("loader를 받지 못함: " + loaderUrl); };
      document.body.appendChild(script);
    </script>
  </body>
</html>
